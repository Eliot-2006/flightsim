# C4 (PRD 8.7): 20 kt headwind change at t = 5 s, then a vertical 10 ft/s 1-cos gust at t = 500 s.
# Design operating point of docs/design.md "M7a: control operating point": S&L model, V = 502 ft/s, h = 10,000 ft,
# xcg = 0.35, actuators and engine lag on, controller 50 Hz with the committed gains
# (scenarios/control/autopilot_gains.toml, generated by python/control_design/design.py).
# Disturbance windows (metrics): [5 s, 500 s) headwind, [500 s, 1000 s] gust; each reports peak altitude/airspeed
# deviation and the time to stay within 2 % of that peak. Commands stay at trim. The gust waits until 500 s so the
# headwind transient (altitude recovery ~140 s with the committed gains, limited by the slow integrators) has died out
# well before it; a closer gust would measure leftover headwind error, not the gust.
# The headwind CHANGE is a time-aligned constant-wind step ([[wind.steps]]): the aircraft flies north (psi = 0),
# so a 20 kt headwind is wind FROM the north, w_N = (-10.288889, 0, 0) m/s (20 kt = 20 * 1852/3600 m/s). It is applied
# from a step boundary, so no integration step straddles the discontinuity; air-relative speed jumps by +20 kt.
# The gust is the MIL-F-8785C-style full-wave 1-cos profile of env/wind.hpp, 10 ft/s = 3.048 m/s, direction
# (0, 0, -1) = an UPDRAFT (NED z is down), 5 s long (~2,500 ft at 502 ft/s); start and duration are step-aligned.
[aircraft]
data = "data/f16/f16_sl.toml"
xcg = 0.35
atmosphere = "sl_adc"
gravity = "sl"
rotor = true
actuators = true

[trim]
V_fps = 502.0
h_ft = 10000.0
gamma_deg = 0.0

[sim]
integrator = "rk4"
dt_s = 0.01
t_final_s = 1000.0
output_every = 20   # 0.2 s samples; actuator peaks use every step regardless
stop_at_ground = true

[autopilot]
rate_hz = 50.0
gains = "scenarios/control/autopilot_gains.toml"
antiwindup = true

[wind]
[[wind.steps]]
t_s = 5.0
delta_mps = [-10.288888889, 0.0, 0.0]

[wind.gust]
t_start_s = 500.0
duration_s = 5.0
amplitude_mps = 3.048
direction_N = [0.0, 0.0, -1.0]
