# C1 (PRD 8.7): +100 ft altitude step at t = 5 s.
# Design operating point of docs/design.md "M7a: control operating point": S&L model, V = 502 ft/s, h = 10,000 ft,
# xcg = 0.35, actuators and engine lag on, controller 50 Hz with the committed gains
# (scenarios/control/autopilot_gains.toml, generated by python/control_design/design.py).
[aircraft]
data = "data/f16/f16_sl.toml"
xcg = 0.35
atmosphere = "sl_adc"
gravity = "sl"
rotor = true
actuators = true

[trim]
V_fps = 502.0
h_ft = 10000.0
gamma_deg = 0.0

[sim]
integrator = "rk4"
dt_s = 0.01
t_final_s = 305.0   # command at 5 s + the 300 s horizon of the design's linear prediction (linear_steps.json):
                    # the altitude PI zero (0.005 rad/s) leaves a slow tail, so steady state is not reached by 60 s
output_every = 5   # 0.05 s samples; metrics and actuator peaks use every step regardless
stop_at_ground = true

[autopilot]
rate_hz = 50.0
gains = "scenarios/control/autopilot_gains.toml"
antiwindup = true

[[commands]]
kind = "altitude"
t_s = 5.0
value_ft = 10100.0   # absolute setpoint: trim 10,000 ft + 100 ft
