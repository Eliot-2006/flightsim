# R3 (PRD 8.3): torque-free asymmetric body, I1 < I2 < I3, omega2(0) = 0.
# L^2 = 9.25 > 2 E I2 = 6.5 -> Landau-Lifshitz branch used by the Jacobi elliptic reference. Conserves E and |H_N|.
[sim]
integrator = "rk4"
dt_s = 0.001
t_final_s = 20.0
output_every = 10

[body]
mass_kg = 1.0
inertia_kgm2 = [[1.0, 0, 0], [0, 2.0, 0], [0, 0, 3.0]]

[initial]
position_m = [0, 0, 0]
velocity_mps = [0, 0, 0]
euler_deg = [0, 0, 0]
omega_radps = [0.5, 0.0, 1.0]

[environment]
gravity_mps2 = 0.0
