name: pages
# Publishes the interactive validation report (out/index.html, generated by scripts/demo.sh) to GitHub Pages.
# Every figure and number on the page is regenerated from source on each deploy; nothing is hand-edited.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: astral-sh/setup-uv@v5
      - run: ./scripts/demo.sh
      - name: Stage site
        run: |
          mkdir -p _site
          cp out/index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
