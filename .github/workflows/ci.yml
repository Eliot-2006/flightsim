name: ci
on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, cc: gcc-13, cxx: g++-13, preset: dev}
          - {os: ubuntu-24.04, cc: gcc-13, cxx: g++-13, preset: release}
          - {os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, preset: dev}
          - {os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, preset: release}
          - {os: macos-15, cc: clang, cxx: clang++, preset: release}
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y ninja-build; else brew install ninja; fi
      - uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}/_deps
          key: deps-${{ matrix.os }}-${{ matrix.cc }}-${{ matrix.preset }}-${{ hashFiles('cmake/Dependencies.cmake') }}
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} -j
      - run: ctest --preset ${{ matrix.preset }}

  sanitizers:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/cache@v4
        with:
          path: build/asan/_deps
          key: deps-asan-${{ hashFiles('cmake/Dependencies.cmake') }}
      - run: cmake --preset asan
      - run: cmake --build --preset asan -j
      - run: ctest --preset asan

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - run: find src apps tests bench -name '*.cpp' -o -name '*.hpp' | xargs clang-format-18 --dry-run --Werror

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Control design consumes the real CLI Jacobian; report tests also run benchmarks.
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset release
      # run.py also runs the tests whose printed numbers feed the report (A1, B1, ...), so the test binaries are built too.
      - run: cmake --build --preset release --target flightsim bench_flightsim unit_tests validation_tests -j 2
      - run: cd python && uv sync --frozen && uv run pytest

  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/cache@v4
        with:
          path: build/release/_deps
          key: deps-bench-${{ hashFiles('cmake/Dependencies.cmake') }}
      - run: cmake --preset release
      - run: cmake --build --preset release -j
      - run: build/release/bench_flightsim --benchmark_min_time=0.05s --benchmark_out=bench.json --benchmark_out_format=json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-json
          path: bench.json

  jsbsim:
    # PRD 8.6 / plan Task 6.3: regenerate the JSBSim model and every JSBSim run, assert they equal the committed
    # references (1e-9), re-run our side, and assert J1-J3.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/cache@v4
        with:
          path: build/release/_deps
          key: deps-jsbsim-${{ hashFiles('cmake/Dependencies.cmake') }}
      - run: cmake --preset release
      - run: cmake --build --preset release -j --target flightsim
      - uses: astral-sh/setup-uv@v5
      - run: cd python && uv sync --frozen && uv run python -m jsbsim_compare.compare --check

  demo:
    # Fresh-checkout reproducibility on Linux (PRD 13 M8): the one-command demo, no cache, no kaleido/Chrome.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: astral-sh/setup-uv@v5
      - run: scripts/demo.sh
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            out/index.html
            out/metrics.json

  coverage:
    # PRD 10.5 (should): llvm-cov line coverage of src/, gated at 85 % on core/, math/ and analysis/ (96.4 % when measured
    # with clang-18 in an ubuntu:24.04 container at M8; the whole of src/ is reported but not gated).
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build llvm-18 jq
      - run: cmake -S . -B build/cov -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fprofile-instr-generate -fcoverage-mapping"
      - run: cmake --build build/cov -j --target unit_tests validation_tests alloc_tests
      - run: mkdir -p build/cov/prof && LLVM_PROFILE_FILE=$PWD/build/cov/prof/%p-%m.profraw ctest --test-dir build/cov --output-on-failure
      - run: llvm-profdata-18 merge -sparse build/cov/prof/*.profraw -o build/cov/all.profdata
      - name: Report
        run: |
          OBJ="build/cov/unit_tests -object build/cov/validation_tests -object build/cov/alloc_tests"
          llvm-cov-18 report $OBJ -instr-profile=build/cov/all.profdata src/flightsim | tee coverage.txt
          echo "## Line coverage, core/ math/ analysis/" >> "$GITHUB_STEP_SUMMARY"
          llvm-cov-18 export $OBJ -instr-profile=build/cov/all.profdata -summary-only src/flightsim/core src/flightsim/math src/flightsim/analysis \
            | jq -r '.data[0].totals.lines.percent' | tee lines.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Gate (PRD 10.5 target, 85 % lines)
        run: awk -v c="$(cat lines.txt)" 'BEGIN { print "line coverage " c " %"; exit !(c >= 85) }'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt
