# S&L low-fidelity F-16, original imperial units. Schema described in SOURCES.md.
# FRD body axes; positive moments follow right-hand rule.
# Elevator: trailing edge down positive, gives negative pitching moment.
# Aileron: right trailing edge down / left up positive, gives negative roll.
# Rudder: trailing edge left positive, gives side force right and negative yaw.
# Coefficients use DEGREES for table lookup; rates p,q,r are rad/s.
# Rows follow axes[0], columns axes[1]. No SI conversion in this file.
# Cl/Cn are odd in beta; stored values apply to nonnegative abs_beta.
# Damping multipliers: CXq,CZq,Cmq use q*cbar/(2V); others use p*b/(2V) or r*b/(2V).
# Cz = lookup(alpha)*(1-(beta/57.3)^2) - 0.19*elevator/25.
# Cy = -0.02*beta + 0.021*aileron/20 + 0.086*rudder/30.
# Cm CG shift adds Cz_total*(xcg_ref-xcg); Cn subtracts Cy_total*(xcg_ref-xcg)*cbar/b.
# Ixz is the positive product; inertia tensor off-diagonal entries are -Ixz.
# W is NOMINAL NASA weight. For S&L check cases use reciprocal_mass=0.00157,
# not g/W; this deliberate distinction is documented in SOURCES.md.
# Actuator lag/rate numbers are S&L/UMN supplemental values; AeroBench uses
# instantaneous position saturation only. Do not attribute lag/rate dynamics to it.
# Canonical, resolved transcription from A; supplemental NASA/UMN values cited per item.
schema_version = 1

